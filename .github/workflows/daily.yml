name: Daily Lesson Automation

on:
  schedule:
    - cron: '0 9,10 * * *'  # 10:00 AM Morocco / backup at 11:00 AM
  workflow_dispatch:      # Kay-khllik t-runnih manuellement f l-blassa

env:
  COURSE_SUBJECT: Python
  COURSE_START_DATE: '2026-09-08'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python daily_learning.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
